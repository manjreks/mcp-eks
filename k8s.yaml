apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels: { app: mcp-server }
  template:
    metadata:
      labels: { app: mcp-server }
    spec:
      containers:
        - name: mcp-server
          image: 046282978963.dkr.ecr.us-east-1.amazonaws.com/mcp-demo:latest
          env:
            - name: PUBLIC_URL
              value: http://ae20ca2f6dd134c43bb0798b6950585c-1842884824.us-east-1.elb.amazonaws.com
            - name: COGNITO_REGION
              value: us-east-1
            - name: COGNITO_USER_POOL_ID
              value: us-east-1_wVpmH7K1g
            - name: COGNITO_CLIENT_IDS
              value: 396tlp2k8qb98luhq11nfo2cok

          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  type: LoadBalancer
  selector: { app: mcp-server }
  ports:
    - port: 80
      targetPort: 8000
